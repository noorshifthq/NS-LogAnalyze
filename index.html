<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoorShift | Local-First Log Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>NoorShift <span class="badge">0.5B AI</span></h1>
            <p>Sovereign log analysis. Your data never leaves this browser.</p>
        </header>

        <main>
            <div id="setup-container" class="card">
                <h3>AI Engine Setup</h3>
                <p id="storage-info">Checking local storage availability...</p>
                <button id="download-btn">Initialize & Cache AI Model</button>
                
                <div id="progress-container" class="hidden">
                    <div class="progress-track">
                        <div id="progress-bar"></div>
                    </div>
                    <p id="status-text">Ready to download (Est. 360MB)...</p>
                </div>
            </div>

            <div id="analyzer-container" class="hidden">
                <textarea id="log-input" placeholder="Paste your server logs, stack traces, or terminal output here..."></textarea>
                <button id="analyze-btn">Analyze Locally</button>

                <div id="output-card" class="card hidden">
                    <h4>NoorShift AI Insight:</h4>
                    <div id="ai-response"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by WebGPU. Architecture: Local-First.</p>
            <button id="reset-btn" class="text-link">Delete Local Cache (Free Space)</button>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
